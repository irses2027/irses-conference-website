<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Sponsors and sponsorship opportunities for IRSES 2027, including grades, contributions, and benefits for supporting the IEEE energy systems conference." />
  <title>Sponsors | IRSES 2027</title>
  <link rel="stylesheet" href="./src/styles/main.css?v=11" />
</head>

<body data-page="sponsors" id="top">
  <main>
    <section class="page-hero">
      <div class="page-hero-inner">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a><span aria-hidden="true">/</span><span>Sponsors</span>
        </nav>
        <h1>Sponsors</h1>
        <p class="page-hero-sub">
          Our sponsors and partners, and opportunities to support IRSES 2027.
        </p>
      </div>
    </section>

    <section class="section muted sponsorship-section reveal" id="sponsors">
      <div class="section-heading wide">
        <div>
          <h2>Sponsors</h2>
        </div>
        <p data-sponsorship-summary></p>
      </div>
      <div class="our-sponsors" aria-label="Our sponsors">
        <h3>Our Sponsors</h3>
        <div class="sponsor-card-grid">
          <article class="sponsor-card">
            <img src="./assets/ieee-gujarat-section.png" alt="IEEE Gujarat Section" />
            <div>
              <strong>IEEE Gujarat Section</strong>
              <span>Financial Co-Sponsor</span>
            </div>
          </article>
          <article class="sponsor-card">
            <img src="./assets/smart-energy-learning-center.jpg" alt="Smart Energy Learning Center" />
            <div>
              <strong>Funded by BSES Rajdhani Power Limited and BSES Yamuna Power Limited</strong>
              <span>Gold Sponsor</span>
            </div>
          </article>
        </div>
      </div>
      <div class="sponsorship-intro" data-sponsorship-intro></div>
      <div class="sponsorship-packages">
        <div class="package-table" role="table" aria-label="Sponsorship packages" data-sponsorship-packages></div>
        <p class="package-note" data-sponsorship-tax-note></p>
      </div>
      <div class="benefit-grid" data-sponsorship-benefits></div>
      <div class="sponsorship-contact" data-sponsorship-contact></div>
    </section>
  </main>

  <script type="module" src="./src/layout.js?v=10"></script>
  <script type="module" src="./src/main.js?v=10"></script>
</body>

</html>
